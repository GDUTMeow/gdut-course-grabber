name: Build and Push Docker Image to Docker Hub

on:
  workflow_dispatch:

jobs:
  determine_version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version_info.outputs.app_version }}
      docker_tags: ${{ steps.version_info.outputs.docker_tags }}
    steps:
      - name: Checkout code (to get SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version_info
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PROJECT_VERSION=$(grep -m1 '^version = "' pyproject.toml | cut -d'"' -f2)

          if [ -z "$PROJECT_VERSION" ]; then
            echo "Unable to read project.version from pyproject.toml" >&2
            exit 1
          fi

          SHORT_SHA="${SOURCE_SHA:0:7}"
          DOCKER_REPOSITORY="gamernotitle/gdut-course-grabber"

          case "$BRANCH_NAME" in
            v3)
              APP_VERSION="v${PROJECT_VERSION}"
              CHANNEL_TAG="latest"
              ;;
            dev)
              APP_VERSION="v${PROJECT_VERSION}-dev.${SHORT_SHA}"
              CHANNEL_TAG="dev"
              ;;
            *)
              SAFE_BRANCH=$(printf '%s' "$BRANCH_NAME" \
                | tr '[:upper:]' '[:lower:]' \
                | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//' \
                | cut -c1-64)
              SAFE_BRANCH="${SAFE_BRANCH:-branch}"
              APP_VERSION="v${PROJECT_VERSION}-dev.${SAFE_BRANCH}.${SHORT_SHA}"
              CHANNEL_TAG=""
              ;;
          esac

          echo "Branch: $BRANCH_NAME"
          echo "Project Version: $PROJECT_VERSION"
          echo "Determined App Version: $APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "docker_tags<<EOF"
            echo "${DOCKER_REPOSITORY}:${APP_VERSION}"
            if [ -n "$CHANNEL_TAG" ]; then
              echo "${DOCKER_REPOSITORY}:${CHANNEL_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build_and_push:
    needs: determine_version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ needs.determine_version.outputs.docker_tags }}
